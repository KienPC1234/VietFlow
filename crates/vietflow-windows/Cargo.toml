[package]
name = "vietflow-windows"
version = "0.1.0"
edition = "2021"
authors = ["KienPC1234"]
description = "Native Windows keyboard hook daemon and system tray host for VietFlow"

[dependencies]
vietflow-core = { path = "../vietflow-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
]
