[package]
name = "vietflow-windows"
version = "1.0.4"
edition = "2021"
authors = ["VietFlow Team"]
description = "Native Windows keyboard hook daemon, tray host and unified executable for VietFlow"
default-run = "VietFlow"

[[bin]]
name = "VietFlow"
path = "src/main.rs"

[dependencies]
vietflow-core = { path = "../vietflow-core" }
vietflow-gui = { path = "../vietflow-gui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
]

[build-dependencies]
winres = "0.1"
