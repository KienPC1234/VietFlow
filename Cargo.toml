[workspace]
resolver = "2"
members = [
    "core",
    "platforms/windows",
    "platforms/windows_tsf",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["VietFlow Team"]
license = "GPL-3.0-or-later"
repository = "https://github.com/KienPC1234/VietFlow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
